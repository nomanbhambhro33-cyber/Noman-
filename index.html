<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noman Bhambhro - Project Marketplace</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
    color:#1f2937;
}

/* HEADER */

header{
    background:#111827;
    color:white;
    padding:15px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:10px;
}

nav button{
    border:none;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:45px;
    margin-bottom:15px;
}

.hero p{
    font-size:18px;
    opacity:.9;
    margin-bottom:25px;
}

.hero button{
    padding:14px 25px;
    border:none;
    border-radius:8px;
    background:white;
    color:#2563eb;
    font-weight:bold;
    cursor:pointer;
}

/* SEARCH */

.search-area{
    width:90%;
    max-width:1000px;
    margin:-25px auto 35px;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
    display:flex;
    gap:10px;
}

.search-area input,
.search-area select{
    padding:13px;
    border:1px solid #ddd;
    border-radius:7px;
}

.search-area input{
    flex:1;
}

/* CONTAINER */

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.section-title{
    margin-bottom:20px;
}

/* PROJECT GRID */

.project-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    padding-bottom:50px;
}

/* CARD */

.project-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    transition:.2s;
}

.project-card:hover{
    transform:translateY(-5px);
}

.project-image{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#e5e7eb;
}

.project-content{
    padding:18px;
}

.project-content h3{
    margin-bottom:8px;
}

.category{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    margin-bottom:10px;
}

.description{
    color:#666;
    line-height:1.5;
    margin-bottom:12px;
}

.price{
    font-size:20px;
    font-weight:bold;
    color:#16a34a;
    margin-bottom:15px;
}

.card-buttons{
    display:flex;
    gap:8px;
}

.card-buttons button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:7px;
    cursor:pointer;
}

.view-btn{
    background:#2563eb;
    color:white;
}

.contact-btn{
    background:#16a34a;
    color:white;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:200;
}

.modal-box{
    background:white;
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow:auto;
    border-radius:12px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.close{
    float:right;
    font-size:25px;
    cursor:pointer;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:7px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

/* FOOTER */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:30px 20px;
}

footer p{
    margin:5px;
}

/* MOBILE */

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:12px;
    }

    .hero h1{
        font-size:32px;
    }

    .search-area{
        flex-direction:column;
    }

}

</style>
</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Noman Marketplace
    </div>

    <nav>

        <button onclick="showHome()">
            Home
        </button>

        <button onclick="openAddProject()">
            + Sell Project
        </button>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Buy & Sell Projects
    </h1>

    <p>
        Discover projects, showcase your work
        and connect with project owners.
    </p>

    <button onclick="openAddProject()">
        Post Your Project
    </button>

</section>


<!-- SEARCH -->

<div class="search-area">

    <input
        type="text"
        id="searchInput"
        placeholder="Search projects..."
        oninput="filterProjects()"
    >

    <select
        id="categoryFilter"
        onchange="filterProjects()"
    >

        <option value="all">
            All Categories
        </option>

        <option value="Website">
            Website
        </option>

        <option value="Mobile App">
            Mobile App
        </option>

        <option value="Game">
            Game
        </option>

        <option value="Software">
            Software
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>


<!-- PROJECTS -->

<div class="container">

    <h2 class="section-title">
        Latest Projects
    </h2>

    <div
        class="project-grid"
        id="projectGrid"
    ></div>

</div>


<!-- ADD PROJECT MODAL -->

<div
    class="modal"
    id="addProjectModal"
>

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal('addProjectModal')"
        >
            ×
        </span>

        <h2>
            Post Your Project
        </h2>

        <form
            onsubmit="addProject(event)"
        >

            <div class="form-group">

                <label>
                    Project Name
                </label>

                <input
                    id="projectName"
                    required
                    placeholder="Example: Online Store Website"
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="projectCategory"
                    required
                >

                    <option value="Website">
                        Website
                    </option>

                    <option value="Mobile App">
                        Mobile App
                    </option>

                    <option value="Game">
                        Game
                    </option>

                    <option value="Software">
                        Software
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Price
                </label>

                <input
                    id="projectPrice"
                    required
                    placeholder="Example: $50"
                >

            </div>


            <div class="form-group">

                <label>
                    Project Image URL
                </label>

                <input
                    id="projectImage"
                    placeholder="https://example.com/image.jpg"
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="projectDescription"
                    required
                    placeholder="Describe your project..."
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Seller Name
                </label>

                <input
                    id="sellerName"
                    required
                    placeholder="Your Name"
                >

            </div>


            <div class="form-group">

                <label>
                    Contact Email
                </label>

                <input
                    id="sellerEmail"
                    type="email"
                    required
                    placeholder="your@email.com"
                >

            </div>


            <div class="form-group">

                <label>
                    WhatsApp Number
                </label>

                <input
                    id="sellerWhatsapp"
                    placeholder="+923001234567"
                >

            </div>


            <button
                class="submit-btn"
                type="submit"
            >
                Publish Project
            </button>

        </form>

    </div>

</div>


<!-- PROJECT DETAILS MODAL -->

<div
    class="modal"
    id="detailsModal"
>

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal('detailsModal')"
        >
            ×
        </span>

        <div id="projectDetails"></div>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <h3>
        Noman Bhambhro Website
    </h3>

    <p>
        Buy • Sell • Discover Projects
    </p>

    <p>
        © 2026 Noman Marketplace
    </p>

</footer>



<script>


/* DEFAULT PROJECTS */

let projects = [

    {
        name:"Professional Portfolio Website",
        category:"Website",
        price:"$50",
        image:"https://images.unsplash.com/photo-1467232004584-a241de8bcf5d",
        description:"A modern responsive portfolio website for developers and designers.",
        seller:"Demo Seller",
        email:"demo@example.com",
        whatsapp:""
    },

    {
        name:"Car Racing Game",
        category:"Game",
        price:"$80",
        image:"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d",
        description:"A simple racing game project that can be customized.",
        seller:"Game Developer",
        email:"game@example.com",
        whatsapp:""
    },

    {
        name:"Mobile App Project",
        category:"Mobile App",
        price:"$100",
        image:"https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c",
        description:"Mobile application project for a startup idea.",
        seller:"App Developer",
        email:"app@example.com",
        whatsapp:""
    }

];


/* LOAD SAVED PROJECTS */

const savedProjects =
    localStorage.getItem("nomanProjects");

if(savedProjects){

    projects =
        JSON.parse(savedProjects);

}


/* DISPLAY PROJECTS */

function displayProjects(list){

    const grid =
        document.getElementById("projectGrid");

    grid.innerHTML="";

    if(list.length===0){

        grid.innerHTML=`
            <p>No projects found.</p>
        `;

        return;

    }


    list.forEach((project,index)=>{

        grid.innerHTML += `

        <div class="project-card">

            <img
                class="project-image"
                src="${project.image || 'https://via.placeholder.com/600x400'}"
                onerror="this.src='https://via.placeholder.com/600x400'"
            >

            <div class="project-content">

                <span class="category">
                    ${project.category}
                </span>

                <h3>
                    ${escapeHTML(project.name)}
                </h3>

                <p class="description">
                    ${escapeHTML(project.description)}
                </p>

                <div class="price">
                    ${escapeHTML(project.price)}
                </div>

                <div class="card-buttons">

                    <button
                        class="view-btn"
                        onclick="viewProject(${index})"
                    >
                        View
                    </button>

                    <button
                        class="contact-btn"
                        onclick="contactSeller(${index})"
                    >
                        Contact
                    </button>

                </div>

            </div>

        </div>

        `;

    });

}


/* SEARCH */

function filterProjects(){

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const category =
        document.getElementById("categoryFilter")
        .value;


    const filtered =
        projects.filter(project=>{

            const matchesSearch =
                project.name
                .toLowerCase()
                .includes(search) ||

                project.description
                .toLowerCase()
                .includes(search);


            const matchesCategory =
                category==="all" ||
                project.category===category;


            return matchesSearch &&
                   matchesCategory;

        });


    displayProjects(filtered);

}


/* ADD PROJECT */

function addProject(event){

    event.preventDefault();


    const project={

        name:
            document.getElementById("projectName").value,

        category:
            document.getElementById("projectCategory").value,

        price:
            document.getElementById("projectPrice").value,

        image:
            document.getElementById("projectImage").value,

        description:
            document.getElementById("projectDescription").value,

        seller:
            document.getElementById("sellerName").value,

        email:
            document.getElementById("sellerEmail").value,

        whatsapp:
            document.getElementById("sellerWhatsapp").value

    };


    projects.unshift(project);


    localStorage.setItem(
        "nomanProjects",
        JSON.stringify(projects)
    );


    displayProjects(projects);


    event.target.reset();

    closeModal("addProjectModal");


    alert(
        "Your project has been published!"
    );

}


/* VIEW PROJECT */

function viewProject(index){

    const project =
        projects[index];


    document.getElementById(
        "projectDetails"
    ).innerHTML=`

        <img
            src="${project.image || 'https://via.placeholder.com/600x400'}"
            style="width:100%;border-radius:10px;margin-bottom:15px"
        >

        <h2>
            ${escapeHTML(project.name)}
        </h2>

        <p style="margin:10px 0">
            <strong>Category:</strong>
            ${escapeHTML(project.category)}
        </p>

        <p style="margin:10px 0">
            <strong>Price:</strong>
            ${escapeHTML(project.price)}
        </p>

        <p style="margin:10px 0;line-height:1.6">
            ${escapeHTML(project.description)}
        </p>

        <hr style="margin:20px 0">

        <h3>
            Seller
        </h3>

        <p>
            ${escapeHTML(project.seller)}
        </p>

        <br>

        <button
            class="contact-btn"
            style="width:100%"
            onclick="contactSeller(${index})"
        >
            Contact Seller
        </button>

    `;


    document.getElementById(
        "detailsModal"
    ).style.display="flex";

}


/* CONTACT SELLER */

function contactSeller(index){

    const project =
        projects[index];


    if(project.whatsapp){

        let number =
            project.whatsapp
            .replace(/\D/g,'');


        window.open(
            "https://wa.me/"+number,
            "_blank"
        );

        return;

    }


    if(project.email){

        window.location.href =
            "mailto:"+project.email+
            "?subject=Interested in your project: "+
            encodeURIComponent(project.name);

        return;

    }


    alert(
        "Seller contact information is not available."
    );

}


/* MODALS */

function openAddProject(){

    document.getElementById(
        "addProjectModal"
    ).style.display="flex";

}


function closeModal(id){

    document.getElementById(id)
        .style.display="none";

}


window.onclick=function(event){

    if(event.target.classList.contains("modal")){

        event.target.style.display="none";

    }

};


/* HOME */

function showHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* SECURITY */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* INITIAL DISPLAY */

displayProjects(projects);

</script>

</body>
</html>
