<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Noman Market - Buy & Sell</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f5f6f8;color:#222}
header{background:#172337;color:white;padding:16px 6%;
display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:bold}
.logo span{color:#00a8ff}
nav a{color:white;margin-left:15px;text-decoration:none}

.hero{background:linear-gradient(135deg,#172337,#075985);
color:white;text-align:center;padding:60px 20px}
.hero h1{font-size:40px;margin-bottom:15px}
.hero span{color:#00a8ff}

.btn{background:#00a8ff;color:white;border:0;
padding:12px 20px;border-radius:7px;cursor:pointer;font-weight:bold}

.container{max-width:1100px;margin:auto;padding:30px 15px}

.search{background:white;padding:15px;border-radius:10px;
display:flex;gap:10px;margin-top:-25px;box-shadow:0 3px 15px #ccc}
input,select,textarea{width:100%;padding:12px;
border:1px solid #ddd;border-radius:6px;margin:6px 0}

.products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:25px}
.card{background:white;border-radius:10px;padding:18px;
box-shadow:0 3px 12px #ddd}
.card h3{margin-bottom:8px}
.price{color:#087f5b;font-size:20px;font-weight:bold;margin:8px 0}
.city{color:#777;margin-bottom:10px}

.form{background:white;padding:25px;border-radius:10px;
max-width:600px;margin:30px auto;box-shadow:0 3px 15px #ddd}

.hidden{display:none}
footer{background:#0d1624;color:white;text-align:center;padding:25px;margin-top:40px}

@media(max-width:800px){
.products{grid-template-columns:1fr 1fr}
.search{flex-direction:column}
}
@media(max-width:500px){
.products{grid-template-columns:1fr}
.hero h1{font-size:30px}
}
</style>
</head>

<body>

<header>
<div class="logo">Noman <span>Market</span></div>
<nav>
<a href="#home">Home</a>
<a href="#products">Products</a>
<a href="#sell">Sell</a>
<a href="#account">Account</a>
</nav>
</header>

<section class="hero" id="home">
<h1>Buy & Sell on <span>Noman Market</span></h1>
<p>Apne city mein products buy aur sell karein.</p>
<br>
<button class="btn" onclick="showSell()">+ Sell an Item</button>
</section>

<div class="container">

<div class="search">
<input id="search" placeholder="Search product..." oninput="loadProducts()">
<select id="city" onchange="loadProducts()">
<option value="">All Cities</option>
<option>Mirpur Khas</option>
<option>Hyderabad</option>
<option>Karachi</option>
<option>Other</option>
</select>
</div>

<section id="products">
<h2 style="margin-top:35px">Latest Products</h2>
<div class="products" id="productList">
<p>Products loading...</p>
</div>
</section>

<section id="sell" class="hidden">
<div class="form">
<h2>Sell Your Product</h2>
<p style="margin:10px 0;color:#666">
Apni product ki information enter karein.
</p>

<input id="pname" placeholder="Product name">
<input id="price" type="number" placeholder="Price (Rs.)">

<select id="pcity">
<option value="">Select City</option>
<option>Mirpur Khas</option>
<option>Hyderabad</option>
<option>Karachi</option>
<option>Other</option>
</select>

<select id="category">
<option>Mobile</option>
<option>Laptop & Computer</option>
<option>Electronics</option>
<option>Other Items</option>
</select>

<textarea id="description" placeholder="Product description"></textarea>

<input id="phone" placeholder="Contact number">

<button class="btn" onclick="addProduct()">Publish Product</button>

<p id="message" style="margin-top:15px"></p>
</div>
</section>

<section id="account">
<div class="form">
<h2>Account</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="btn" onclick="signup()">Create Account</button>
<button class="btn" onclick="login()">Login</button>
<button class="btn" onclick="logout()">Logout</button>

<p id="authMessage" style="margin-top:15px"></p>
</div>
</section>

</div>

<footer>
<p>© 2026 Noman Market</p>
<p>Buy • Sell • Connect</p>
</footer>
